name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  training-setup:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Training setup regression tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Install real Windows training environment
        run: python training/train_voice.py setup --venv "${{ runner.temp }}/training-env"
      - name: Check training CLI and native extension
        shell: pwsh
        run: |
          & "${{ runner.temp }}/training-env/Scripts/python.exe" -c "import piper.train.vits.monotonic_align.monotonic_align.core; from piper.train.__main__ import main; print('Training imports OK')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "${{ runner.temp }}/training-env/Scripts/python.exe" -m piper.train --help
          exit $LASTEXITCODE

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            preset: windows-release
          - os: ubuntu-24.04
            preset: linux-release
          - os: macos-14
            preset: macos-release
    runs-on: ${{ matrix.os }}
    env:
      VT_VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"

    steps:
      - uses: actions/checkout@v4

      - name: Export GitHub Actions cache variables (vcpkg binary cache)
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config autoconf autoconf-archive automake libtool \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev \
            libgl1-mesa-dev libsecret-1-dev libasound2-dev libpulse-dev

      - name: macOS packages
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Bootstrap vcpkg
        shell: bash
        run: |
          # MSVC setup overwrites VCPKG_ROOT with Visual Studio's bundled copy.
          export VCPKG_ROOT="$VT_VCPKG_ROOT"
          echo "VCPKG_ROOT=$VCPKG_ROOT" >> "$GITHUB_ENV"
          git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          if [ "$RUNNER_OS" = "Windows" ]; then "$VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics; else "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics; fi

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      - name: Package Windows installer
        if: runner.os == 'Windows'
        working-directory: build/${{ matrix.preset }}
        run: cpack -G NSIS

      - name: Package
        working-directory: build/${{ matrix.preset }}
        run: cpack -G ZIP

      - uses: actions/upload-artifact@v4
        with:
          name: VoiceTwitch-${{ matrix.preset }}
          path: |
            build/${{ matrix.preset }}/VoiceTwitch-*.zip
            build/${{ matrix.preset }}/VoiceTwitch-*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, training-setup]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: VoiceTwitch ${{ github.ref_name }}
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: |
            release-assets/VoiceTwitch-*.zip
            release-assets/VoiceTwitch-*.exe
