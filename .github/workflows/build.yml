name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish v0.1.1 after all build and installer checks pass
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  training-setup:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.17'
          architecture: x64
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Training regression tests
        run: python -m unittest discover -s tests -p "test_*.py" -v
      - name: Build and validate relocatable training runtime
        run: python scripts/bundle-training-runtime.py --output training-runtime
      - name: Archive runtime (including readiness marker and package licenses)
        run: tar -cf training-runtime.tar training-runtime
      - uses: actions/upload-artifact@v4
        with:
          name: windows-training-runtime
          path: training-runtime.tar
          compression-level: 0
          if-no-files-found: error

  build:
    needs: training-setup
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            preset: windows-release
          - os: ubuntu-24.04
            preset: linux-release
          - os: macos-14
            preset: macos-release
    runs-on: ${{ matrix.os }}
    env:
      VT_VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      VCPKG_BINARY_SOURCES: "clear;default,readwrite"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/vcpkg/archives
            ~/AppData/Local/vcpkg/archives
          key: vcpkg-${{ matrix.os }}-${{ hashFiles('vcpkg.json', 'CMakePresets.json') }}

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config autoconf autoconf-archive automake libtool \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev \
            libgl1-mesa-dev libsecret-1-dev libasound2-dev libpulse-dev

      - name: macOS packages
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Ensure Windows installer tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}/NSIS/makensis.exe")) {
            choco install nsis --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Bootstrap vcpkg
        shell: bash
        run: |
          # MSVC setup overwrites VCPKG_ROOT with Visual Studio's bundled copy.
          export VCPKG_ROOT="$VT_VCPKG_ROOT"
          echo "VCPKG_ROOT=$VCPKG_ROOT" >> "$GITHUB_ENV"
          git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
          if [ "$RUNNER_OS" = "Windows" ]; then "$VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics; else "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics; fi

      - uses: actions/download-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: windows-training-runtime
      - name: Extract prebuilt training runtime
        if: runner.os == 'Windows'
        run: tar -xf training-runtime.tar

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      - name: Package Windows installer
        if: runner.os == 'Windows'
        working-directory: build/${{ matrix.preset }}
        run: cpack -G NSIS

      - name: Verify installed Windows training runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem build/windows-release/VoiceTwitch-*.exe | Select-Object -First 1
          if (-not $installer) { throw "Windows installer was not generated" }
          $destination = Join-Path $env:RUNNER_TEMP 'VoiceTwitch Smoke'
          $process = Start-Process $installer.FullName -ArgumentList "/S /D=$destination" -Wait -PassThru
          if ($process.ExitCode -notin 0,3010) { throw "Installer failed: $($process.ExitCode)" }
          $env:PYTHONHOME = "${{ runner.temp }}/no-system-python"
          $env:PYTHONPATH = "${{ runner.temp }}/no-system-packages"
          $env:PATH = "$env:SystemRoot/System32;$env:SystemRoot"
          & "$destination/training-runtime/python.exe" -I "$destination/training/train_voice.py" check-runtime
          exit $LASTEXITCODE

      - name: Package
        working-directory: build/${{ matrix.preset }}
        run: cpack -G ZIP

      - uses: actions/upload-artifact@v4
        with:
          name: VoiceTwitch-${{ matrix.preset }}
          path: |
            build/${{ matrix.preset }}/VoiceTwitch-*.zip
            build/${{ matrix.preset }}/VoiceTwitch-*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    needs: [build, training-setup]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: VoiceTwitch-*
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.1.1' }}
          target_commitish: ${{ github.sha }}
          name: VoiceTwitch ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.1.1' }}
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: |
            release-assets/VoiceTwitch-*.zip
            release-assets/VoiceTwitch-*.exe
